# Portable certminder deployment. Put this file next to your certminder.yml
# (and any private-CA PEM it references), then run:
#
#   docker compose up -d --build
#
# Config and CA are mounted read-only; state persists in a named volume. Paths
# INSIDE certminder.yml (e.g. cafile:) are container paths under /etc/certminder,
# so the same config works unchanged on Windows, macOS and Linux hosts.
#
# Secrets referenced from certminder.yml via ${VAR} (e.g. password: ${SMTP_PASSWORD})
# go in an .env file next to this docker-compose.yml — copy .env.example to
# .env and fill it in. .env is gitignored and optional (omit it if you have
# no secrets to pass).
services:
  certminder:
    build: .
    image: certminder:prod
    container_name: certminder
    restart: unless-stopped
    command: run -c /etc/certminder/certminder.yml
    env_file:
      - path: .env
        required: false
    volumes:
      - ./certminder.yml:/etc/certminder/certminder.yml:ro
      # One line per private-CA bundle your config references (remove if none):
      - ./azienda-zero-ca.pem:/etc/certminder/azienda-zero-ca.pem:ro
      - certminder-state:/var/lib/certminder
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  certminder-state:
